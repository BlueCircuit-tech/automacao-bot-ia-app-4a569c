  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #e2e2e2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #22C55E40; border-radius: 4px; }

    [data-tela]:not(.hidden) {
      animation: fadeSlideIn 0.28s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .ativo {
      color: #22C55E !important;
      position: relative;
    }
    .ativo::after {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 3px;
      background: #22C55E;
      border-radius: 3px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: #22C55E;
      color: #fff;
      box-shadow: 0 4px 14px rgba(34,197,94,0.30);
    }
    .btn-primary:hover { background: #16A34A; box-shadow: 0 6px 20px rgba(34,197,94,0.40); }
    .btn-secondary {
      background: #F0FDF4;
      color: #14532D;
      border: 1.5px solid #22C55E40;
    }
    .btn-secondary:hover { background: #DCFCE7; }
    .btn-ghost {
      background: transparent;
      color: #14532D;
      padding: 10px 16px;
    }
    .btn-ghost:hover { background: #F0FDF4; }
    .btn-danger {
      background: #FEF2F2;
      color: #DC2626;
      border: 1.5px solid #FECACA;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 1px 3px rgba(20,83,45,0.06), 0 1px 2px rgba(20,83,45,0.04);
      transition: box-shadow 0.2s ease;
    }
    .card-interactive { cursor: pointer; }
    .card-interactive:hover { box-shadow: 0 10px 25px rgba(20,83,45,0.10), 0 4px 10px rgba(20,83,45,0.06); }
    .card-interactive:active { transform: scale(0.985); transition: all 0.15s ease; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    input, select {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      padding: 14px 16px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      background: #fff;
      color: #14532D;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      border-color: #22C55E;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.12);
    }
    input::placeholder { color: #9CA3AF; }

    :focus-visible {
      outline: 2px solid #22C55E;
      outline-offset: 2px;
    }

    #toast-container {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: calc(100% - 40px);
      max-width: 350px;
    }
    .toast {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
      animation: toastIn 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.saindo { animation: toastOut 0.3s ease forwards; }
    .toast-ok   { background: #14532D; }
    .toast-erro { background: #DC2626; }
    .toast-info { background: #2563EB; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(-20px) scale(0.95); }
    }

    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 8000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: modalFadeIn 0.25s ease;
    }
    #modal-overlay.fechando { animation: modalFadeOut 0.2s ease forwards; }
    @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalFadeOut { from { opacity: 1; } to { opacity: 0; } }
    #modal-caixa {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 390px;
      max-height: 75vh;
      overflow-y: auto;
      animation: modalSlideUp 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.30);
    }
    @keyframes modalSlideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .pulse-verde {
      animation: pulseVerde 2s ease-in-out infinite;
    }
    @keyframes pulseVerde {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
      50%      { box-shadow: 0 0 0 12px rgba(34,197,94,0); }
    }

    .shimmer {
      background: linear-gradient(90deg, #F0FDF4 25%, #DCFCE7 50%, #F0FDF4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .ripple {
      position: relative;
      overflow: hidden;
    }
    .ripple::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, transparent 70%);
      opacity: 0;
      transform: scale(0);
      border-radius: inherit;
      transition: all 0.5s ease;
      pointer-events: none;
    }
    .ripple:active::after {
      opacity: 1;
      transform: scale(2);
      transition: all 0s;
    }

    @media (min-width: 768px) {
      body { padding: 20px; }
    }
  </style>
</head>

    function mapa_de_carregadores_renderizar_marcadores(postos) {
      const container = document.getElementById('mapa-marcadores');

      postos.forEach((p, i) => {
        const g = document.createElementNS('http://www.w3.org/2000/svg','g');
        g.setAttribute('class','cursor-pointer');
        g.setAttribute('onclick',`mapa_de_carregadores_selecionar_posto(${p.id})`);
        const pulse = document.createElementNS('http://www.w3.org/2000/svg','circle');
        pulse.setAttribute('cx', p.lng);
        pulse.setAttribute('cy', p.lat);
        pulse.setAttribute('r','12');
        pulse.setAttribute('fill', cores[p.status]);
        pulse.setAttribute('opacity','0.2');
        if (p.status === 'livre') {
          pulse.innerHTML = `<animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>`;
        }
        const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
        circle.setAttribute('cx', p.lng);
        circle.setAttribute('cy', p.lat);
        circle.setAttribute('r','8');
        circle.setAttribute('fill', cores[p.status]);

        icon.setAttribute('x', p.lng);
        icon.setAttribute('y', p.lat + 3);
        icon.setAttribute('text-anchor','middle');
        icon.setAttribute('font-size','7');
        icon.setAttribute('fill','white');
        icon.setAttribute('font-weight','bold');
        icon.textContent = '⚡';
        g.appendChild(pulse);
        g.appendChild(circle);
        g.appendChild(icon);
        container.appendChild(g);
      });
    }

    function mapa_de_carregadores_selecionar_posto(id) {
      const posto = mapa_de_carregadores_postos.find(p => p.id === id);

      mapa_de_carregadores_posto_selecionado = posto;

      document.getElementById('mapa-endereco-posto').innerHTML = `<svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>${posto.endereco}`;
      document.getElementById('mapa-distancia').textContent = posto.distancia.toFixed(1) + ' km';
      document.getElementById('mapa-preco-kwh').textContent = 'R$ ' + posto.precoKwh.toFixed(2).replace('.',',');
      document.getElementById('mapa-potencia').textContent = posto.potencia + ' kW';
      document.getElementById('mapa-conector').textContent = posto.conector;

        indStatus.className = 'w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse';

        indStatus.className = 'w-2.5 h-2.5 rounded-full bg-yellow-500';
        statusText.className = 'text-xs font-semibold text-yellow-600';
        statusText.textContent = 'Todas vagas ocupadas';

        statusText.className = 'text-xs font-semibold text-red-600';

      mapa_de_carregadores_filtro_atual = tipo;

    function mapa_de_carregadores_filtrar(termo) {
      mapa_de_carregadores_termo = termo.toLowerCase().trim();
      mapa_de_carregadores_aplicar_filtro();
    }

    function mapa_de_carregadores_aplicar_filtro() {
      let postos = [...mapa_de_carregadores_postos];
      const t = mapa_de_carregadores_termo || '';
      if (t) {
        postos = postos.filter(p => p.nome.toLowerCase().includes(t) || p.endereco.toLowerCase().includes(t));
      }
      if (mapa_de_carregadores_filtro_atual !== 'todos') {
        if (mapa_de_carregadores_filtro_atual === 'rapido') {
          postos = postos.filter(p => p.potencia >= 150);
        } else {
          postos = postos.filter(p => p.status === mapa_de_carregadores_filtro_atual);
        }
      }
      mapa_de_carregadores_renderizar_marcadores(postos);
      const ev = document.getElementById('mapa-estado-vazio');
      if (ev) ev.classList.toggle('hidden', postos.length > 0);
      if (postos.length > 0 && !postos.find(p => p.id === mapa_de_carregadores_posto_selecionado.id)) {
        mapa_de_carregadores_selecionar_posto(postos[0].id);

    }

  <script>
    /* ── Utilitários ── */
    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function dataBR(iso) {
      if (!iso) return '—';
      const [a, m, d] = iso.split('-');
      return d + '/' + m + '/' + a;
    }

    /* ── Toast ── */
    function toast(mensagem, tipo) {
      tipo = tipo || 'info';
      var container = document.getElementById('toast-container');
      var el = document.createElement('div');
      var icones = {
        ok:    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        erro:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
      };
      el.className = 'toast toast-' + tipo;
      el.innerHTML = icones[tipo] + '<span>' + mensagem + '</span>';
      container.appendChild(el);
      setTimeout(function() {
        el.classList.add('saindo');
        setTimeout(function() { el.remove(); }, 300);
      }, 3000);
    }

    /* ── Modal ── */
    function abrirModal(html, titulo) {
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-conteudo').innerHTML = html;
      var overlay = document.getElementById('modal-overlay');
      overlay.classList.remove('hidden', 'fechando');
      document.body.style.overflow = 'hidden';
    }
    function fecharModal(evt) {
      if (evt && evt.target !== document.getElementById('modal-overlay')) return;
      var overlay = document.getElementById('modal-overlay');
      overlay.classList.add('fechando');
      setTimeout(function() {
        overlay.classList.add('hidden');
        document.body.style.overflow = '';
      }, 200);
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    /* ── Relógio da barra de status ── */
    function atualizarRelogio() {
      var agora = new Date();
      var h = agora.getHours().toString().padStart(2, '0');
      var m = agora.getMinutes().toString().padStart(2, '0');
      var el = document.getElementById('status-hora');
      if (el) el.textContent = h + ':' + m;
    }
    atualizarRelogio();
    setInterval(atualizarRelogio, 30000);

    /* ── Roteador ── */
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('mapa-de-carregadores');
    });
  </script>
</body>
</html>
